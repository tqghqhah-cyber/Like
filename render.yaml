services:
  - type: web
    name: like-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 8 --bind 0.0.0.0:$PORT --timeout 120 wsgi:app
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DISABLE_SCHEDULER
        value: "1"
